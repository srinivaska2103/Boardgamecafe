<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
    <!-- <link rel="icon" href="assets/game-center.png"> -->
    <title>Join the Table | Dice & Beans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#f97316' } } }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 h-screen overflow-hidden flex flex-col">

    <nav class="p-4 flex justify-end gap-3 shrink-0">
        <button id="theme-toggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border dark:border-slate-700 hover:ring-2 ring-primary transition-all">
            <i data-lucide="moon" id="theme-icon" class="w-5 h-5"></i>
        </button>
        <button id="dir-toggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border dark:border-slate-700 font-bold text-xs hover:ring-2 ring-primary transition-all">
            LTR
        </button>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 overflow-hidden">
        <div class="w-full max-w-md scale-95 md:scale-100"> <div class="text-center mb-6">
            <a href="index.html">
 <div class="inline-flex items-center gap-2 mb-1">
                    <i data-lucide="dices" class="text-primary w-8 h-8 md:w-10 md:h-10"></i>
                    <span class="text-2xl md:text-3xl font-black uppercase tracking-tighter">Dice & Beans</span>
                </div>
            </a>
               
             <!-- <p class="text-slate-500 dark:text-slate-400 text-sm">Your seat at the table is waiting.</p> -->
            </div>

            <div class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] shadow-2xl border border-slate-100 dark:border-slate-700 relative">
                
                <div class="flex p-1 bg-slate-100 dark:bg-slate-900 rounded-2xl mb-6">
                    <button id="show-login" class="flex-1 py-2 rounded-xl font-bold text-sm transition-all bg-white dark:bg-slate-800 shadow-sm text-primary">Login</button>
                    <button id="show-signup" class="flex-1 py-2 rounded-xl font-bold text-sm transition-all text-slate-500 hover:text-primary">Sign Up</button>
                </div>

                <div class="relative overflow-hidden">
                    <form id="login-form" class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Email</label>
                            <input type="email" placeholder="gamer@example.com" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:ring-2 ring-primary/50 outline-none transition-all text-sm">
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between items-center">
                                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Password</label>
                                <a href="#" class="text-[10px] font-bold text-primary hover:underline">Forgot?</a>
                            </div>
                            <input type="password" placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:ring-2 ring-primary/50 outline-none transition-all text-sm">
                        </div>
                        <button class="w-full bg-primary text-white py-3.5 rounded-xl font-black text-base hover:bg-orange-600 transition-all shadow-lg shadow-orange-500/20 active:scale-95">Enter Café</button>
                    </form>

                    <form id="signup-form" class="space-y-4 hidden">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Full Name</label>
                            <input type="text" placeholder="John Doe" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:ring-2 ring-primary/50 outline-none transition-all text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Email</label>
                            <input type="email" placeholder="newgamer@example.com" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:ring-2 ring-primary/50 outline-none transition-all text-sm">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Password</label>
                            <input type="password" placeholder="Create Password" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:ring-2 ring-primary/50 outline-none transition-all text-sm">
                        </div>
                        <button class="w-full bg-primary text-white py-3.5 rounded-xl font-black text-base hover:bg-orange-600 transition-all shadow-lg shadow-orange-500/20 active:scale-95">Create Account</button>
                    </form>
                </div>

                <div class="mt-6 text-center">
                    <div class="relative mb-4">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100 dark:border-slate-700"></div></div>
                        <div class="relative px-3 text-[10px] font-bold text-slate-400 bg-white dark:bg-slate-800 uppercase inline-block">Or play with</div>
                    </div>
                    <div class="flex justify-center gap-3">
                        <button class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700 hover:border-primary transition-all"><i data-lucide="chrome" class="w-4 h-4"></i></button>
                        <button class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700 hover:border-primary transition-all"><i data-lucide="facebook" class="w-4 h-4"></i></button>
                        <button class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700 hover:border-primary transition-all"><i data-lucide="github" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const html = document.documentElement;
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const showLoginBtn = document.getElementById('show-login');
        const showSignupBtn = document.getElementById('show-signup');

        const toggleForms = (show) => {
            if (show === 'signup') {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                showSignupBtn.classList.add('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'text-primary');
                showSignupBtn.classList.remove('text-slate-500');
                showLoginBtn.classList.remove('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'text-primary');
                showLoginBtn.classList.add('text-slate-500');
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                showLoginBtn.classList.add('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'text-primary');
                showLoginBtn.classList.remove('text-slate-500');
                showSignupBtn.classList.remove('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'text-primary');
                showSignupBtn.classList.add('text-slate-500');
            }
        };

        showLoginBtn.onclick = () => toggleForms('login');
        showSignupBtn.onclick = () => toggleForms('signup');

        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            themeIcon.setAttribute('data-lucide', 'sun');
            lucide.createIcons();
        }

        themeBtn.onclick = () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        };

        const dirBtn = document.getElementById('dir-toggle');
        dirBtn.onclick = () => {
            const currentDir = html.getAttribute('dir') || 'ltr';
            const newDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
            html.setAttribute('dir', newDir);
            dirBtn.innerText = newDir.toUpperCase();
        };
    </script>
</body>
</html>
