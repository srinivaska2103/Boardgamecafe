<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
    <title>Enter the Café | Dice & Beans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#f97316' } } }
        }
    </script>
    <style>
        .social-btn:hover { transform: translateY(-3px); }
        
        /* THE FIX: Force icons to be bold and visible */
        svg.lucide {
            display: block !important;
            stroke-width: 2.5px;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <nav class="p-4 flex justify-end gap-3 shrink-0 relative z-20">
        <button id="theme-toggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border dark:border-slate-700 hover:ring-2 ring-primary transition-all">
            <div class="w-5 h-5"><i data-lucide="moon" id="theme-icon"></i></div>
        </button>
        <button id="dir-toggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border dark:border-slate-700 font-bold text-xs hover:ring-2 ring-primary transition-all uppercase">
            LTR
        </button>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 relative py-10">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

        <div class="w-full max-w-md scale-95 md:scale-100 relative z-10">
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 group">
                    <div class="bg-primary p-2 rounded-xl group-hover:rotate-12 transition-transform shadow-lg shadow-orange-500/20">
                        <div class="w-8 h-8 md:w-10 md:h-10 text-white"><i data-lucide="dices"></i></div>
                    </div>
                    <span class="text-3xl md:text-4xl font-black uppercase tracking-tighter">Dice & Beans</span>
                </a>
            </div>

            <div class="bg-white dark:bg-slate-900 p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 dark:border-slate-800">
                <h2 class="text-2xl font-black mb-6 text-center dark:text-white">Welcome Back</h2>

                <form id="login-form" class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-primary ml-1">Email Address</label>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-primary transition-colors">
                                <i data-lucide="mail"></i>
                            </div>
                            <input type="email" required placeholder="gamer@example.com" class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-12 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm dark:text-white">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-primary ml-1">Secret Key</label>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-primary transition-colors">
                                <i data-lucide="lock"></i>
                            </div>
                            <input type="password" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-12 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm dark:text-white">
                        </div>
                        <div class="flex justify-between items-center px-1 mt-2">
    <a href="regeister.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-primary transition-colors">
        New Player? <span class="text-primary">Sign up</span>
    </a>

    <a href="#" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-primary transition-colors">
        Forgot Password?
    </a>
</div>
                    </div>

                    <button type="submit" class="w-full bg-primary text-white py-5 rounded-[1.5rem] font-black text-lg hover:bg-orange-600 transition-all shadow-xl shadow-orange-500/30 active:scale-95 flex items-center justify-center gap-3 group">
                        Login
                        <div class="w-5 h-5 group-hover:translate-x-1 transition-transform"><i data-lucide="chevron-right"></i></div>
                    </button>
                </form>

                <div class="mt-10">
                    <div class="relative mb-6">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100 dark:border-slate-800"></div></div>
                        <!-- <div class="relative px-4 text-[10px] font-black text-slate-400 bg-white dark:bg-slate-900 uppercase inline-block  -translate-x-1-2">Quick Entry</div> -->
                    </div>

                  <div class="grid grid-cols-3 gap-4">
    <button type="button" class="social-login-btn social-btn flex justify-center py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 border-2 border-transparent hover:bg-[#ea4335] transition-all group shadow-sm" data-provider="Google">
        <div class="w-6 h-6 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ea4335" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:stroke-white transition-colors">
                <circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>
            </svg>
        </div>
    </button>
    
    <button type="button" class="social-login-btn social-btn flex justify-center py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 border-2 border-transparent hover:bg-[#1877f2] transition-all group shadow-sm" data-provider="Facebook">
        <div class="w-6 h-6 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1877f2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:stroke-white transition-colors">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
            </svg>
        </div>
    </button>
    
    <button type="button" class="social-login-btn social-btn flex justify-center py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 border-2 border-transparent hover:bg-black dark:hover:bg-white transition-all group shadow-sm" data-provider="X">
        <div class="w-6 h-6 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-black dark:text-white group-hover:text-white dark:group-hover:text-black transition-colors">
                <path d="M4 4l11.733 16h4.267l-11.733-16z"/><path d="M4 20l6.768-6.768m2.46-2.46L20 4"/>
            </svg>
        </div>
    </button>
</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Use window.onload to ensure library is 100% ready
        window.onload = function() {
            lucide.createIcons();

            const html = document.documentElement;
            const themeBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const dirBtn = document.getElementById('dir-toggle');

            // --- Theme Logic ---
            const refreshIcons = () => { lucide.createIcons(); };

            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                if(themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
                refreshIcons();
            }

            themeBtn.onclick = () => {
                html.classList.toggle('dark');
                const isDark = html.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                refreshIcons();
            };

            // --- Direction Logic ---
            const savedDir = localStorage.getItem('site-direction') || 'ltr';
            html.setAttribute('dir', savedDir);
            dirBtn.innerText = savedDir.toUpperCase();

            dirBtn.onclick = () => {
                const currentDir = html.getAttribute('dir') || 'ltr';
                const newDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
                html.setAttribute('dir', newDir);
                localStorage.setItem('site-direction', newDir);
                dirBtn.innerText = newDir.toUpperCase();
            };

            // --- Click Events ---
            document.querySelectorAll('.social-login-btn').forEach(button => {
                button.onclick = () => alert(`Connecting to ${button.dataset.provider}...`);
            });
        };
    </script>
</body>
</html>
