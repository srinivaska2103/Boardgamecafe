<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
    <title>Join the Table | Dice & Beans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#f97316',
                        google: '#ea4335',
                        facebook: '#1877f2'
                    } 
                } 
            }
        }
    </script>
    <style>
        .social-btn:hover { transform: translateY(-3px); }
        input:focus { transform: translateY(-2px); }
        .custom-scroll { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col custom-scroll">

    <nav class="p-4 flex justify-end gap-3 shrink-0 relative z-20">
        <button id="theme-toggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border dark:border-slate-700 hover:ring-2 ring-primary transition-all">
            <svg id="theme-icon-svg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button id="dir-toggle" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-sm border dark:border-slate-700 font-bold text-xs hover:ring-2 ring-primary transition-all uppercase">
            LTR
        </button>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 relative py-12">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary/20 rounded-full blur-[120px] pointer-events-none"></div>

        <div class="w-full max-w-md relative z-10">
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 group">
                    <div class="bg-primary p-2 rounded-xl group-hover:rotate-12 transition-transform shadow-lg shadow-orange-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-5a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 14h.01"/><path d="M18 18h.01"/><path d="M15 15h.01"/></svg>
                    </div>
                    <span class="text-3xl md:text-4xl font-black uppercase tracking-tighter">Dice & Beans</span>
                </a>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-3 font-medium uppercase tracking-widest leading-none">New Player Registration</p>
            </div>

            <div class="bg-white dark:bg-slate-900 p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 dark:border-slate-800">
                
                <h2 class="text-2xl font-black mb-6 text-center dark:text-white">Create Account</h2>

                <form id="signup-form" class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-primary ml-1">Full Name</label>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-primary transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <input type="text" required placeholder="John Doe" 
                                   class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-12 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm dark:text-white">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-primary ml-1">Email Address</label>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-primary transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            </div>
                            <input type="email" required placeholder="gamer@example.com" 
                                   class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-12 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm dark:text-white">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black uppercase tracking-widest text-primary ml-1">Password</label>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-primary transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            </div>
                            <input type="password" required placeholder="Min. 8 characters" 
                                   class="w-full bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl px-12 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all text-sm dark:text-white">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-primary text-white py-5 rounded-[1.5rem] font-black text-lg hover:bg-orange-600 transition-all shadow-xl shadow-orange-500/30 active:scale-95 flex items-center justify-center gap-3 group mt-4">
                        Start Playing
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </form>

                <div class="mt-8">
                    <div class="relative mb-6">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100 dark:border-slate-800"></div></div>
                        <div class="relative px-4 text-[10px] font-black text-slate-400 bg-white dark:bg-slate-900 uppercase inline-block left-1/2 -translate-x-1/2">Express Join</div>
                    </div>

                    <div class="grid grid-cols-3 gap-4">
                        <button type="button" class="social-btn flex justify-center py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 border-2 border-transparent hover:bg-[#ea4335] transition-all group">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ea4335" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:stroke-white transition-colors"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
                        </button>
                        <button type="button" class="social-btn flex justify-center py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 border-2 border-transparent hover:bg-[#1877f2] transition-all group">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1877f2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:stroke-white transition-colors"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                        </button>
                        <button type="button" class="social-btn flex justify-center py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 border-2 border-transparent hover:bg-black dark:hover:bg-white transition-all group">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-black dark:text-white group-hover:text-white dark:group-hover:text-black transition-colors"><path d="M4 4l11.733 16h4.267l-11.733-16z"/><path d="M4 20l6.768-6.768m2.46-2.46L20 4"/></svg>
                        </button>
                    </div>
                </div>

                <p class="text-center mt-8 text-[11px] font-bold text-slate-400 uppercase tracking-widest">
                    Already have an account? <a href="login.html" class="text-primary hover:underline">Login Now</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        const html = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const themeIconSvg = document.getElementById('theme-icon-svg');
        const dirBtn = document.getElementById('dir-toggle');

        // SVG Icons for Theme Toggle
        const sunSvg = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>`;
        const moonSvg = `<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>`;

        // Theme Persistence
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            themeIconSvg.innerHTML = sunSvg;
        }

        themeBtn.onclick = () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIconSvg.innerHTML = isDark ? sunSvg : moonSvg;
        };

        // Direction Logic
        const savedDir = localStorage.getItem('site-direction') || 'ltr';
        html.setAttribute('dir', savedDir);
        dirBtn.innerText = savedDir.toUpperCase();

        dirBtn.onclick = () => {
            const currentDir = html.getAttribute('dir') || 'ltr';
            const newDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
            html.setAttribute('dir', newDir);
            localStorage.setItem('site-direction', newDir);
            dirBtn.innerText = newDir.toUpperCase();
        };

        // Demo Form Submit
        document.getElementById('signup-form').onsubmit = (e) => {
            e.preventDefault();
            alert('Welcome to the Café! Creating your player profile...');
        };
    </script>
</body>
</html>
