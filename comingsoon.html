<!DOCTYPE html>
<html lang="en" dir="ltr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M17 8h1a4 4 0 1 1 0 8h-1'/><path d='M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z'/><line x1='6' x2='6' y1='2' y2='4'/><line x1='10' x2='10' y1='2' y2='4'/><line x1='14' x2='14' y1='2' y2='4'/></svg>">    <link rel="icon" href="assets/game-center.png">
    <title>Launching Soon | Dice & Beans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#f97316' } } }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-black dark:text-slate-100 transition-colors duration-300 h-screen overflow-hidden flex flex-col">

    <nav class="p-6 flex justify-end gap-4 shrink-0 relative z-10">
        <button id="theme-toggle" class="p-3 rounded-2xl bg-white dark:bg-zinc-900 shadow-xl border dark:border-slate-700 hover:ring-2 ring-primary transition-all">
            <i data-lucide="moon" id="theme-icon" class="w-5 h-5"></i>
        </button>
        <button id="dir-toggle" class="p-3 rounded-2xl bg-white dark:bg-zinc-900 shadow-xl border dark:border-slate-700 font-bold text-xs hover:ring-2 ring-primary transition-all">
            LTR
        </button>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center px-4 relative">
        
        <div class="absolute opacity-5 dark:opacity-10 animate-float pointer-events-none">
            <i data-lucide="dices" class="w-64 h-64 md:w-96 md:h-96 text-primary"></i>
        </div>

        <div class="max-w-2xl w-full text-center relative z-10">
            <div class="inline-flex items-center gap-3 mb-6">
                <i data-lucide="hourglass" class="text-primary w-8 h-8 animate-spin-slow"></i>
                <span class="text-2xl font-black uppercase tracking-tighter">Dice & Beans</span>
            </div>

            <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tight">
                Something <span class="text-primary italic">Epic</span> is Loading
            </h1>
            
            <p class="text-lg text-slate-500 dark:text-slate-400 mb-10 max-w-md mx-auto leading-relaxed">
                We're currently setting up the tables and brewing the coffee. Our digital café experience will be live very soon!
            </p>

            <div class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto mb-12">
                <input type="email" placeholder="Get notified via email" class="flex-grow bg-white dark:bg-zinc-900 border border-slate-200 dark:border-slate-700 rounded-2xl px-6 py-4 outline-none focus:ring-2 ring-primary/50 transition-all">
                <button class="bg-primary text-white px-8 py-4 rounded-2xl font-black hover:bg-orange-600 transition-all shadow-lg shadow-orange-500/20 active:scale-95">Notify Me</button>
            </div>

            <a href="index.html" class="inline-flex items-center gap-2 text-slate-500 dark:text-slate-400 font-bold hover:text-primary transition-colors group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                Return to Main Website
            </a>
        </div>
    </main>

    <footer class="p-8 text-center text-xs text-slate-400 font-medium shrink-0">
        © 2026 Dice & Beans Board Game Café. All rights reserved.
    </footer>

    <script>
        lucide.createIcons();
        const html = document.documentElement;

        // --- Theme Persistence Logic ---
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            themeIcon.setAttribute('data-lucide', 'sun');
            lucide.createIcons();
        }

        themeBtn.onclick = () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        };

        // --- LTR/RTL Logic ---
        const dirBtn = document.getElementById('dir-toggle');
        dirBtn.onclick = () => {
            const currentDir = html.getAttribute('dir') || 'ltr';
            const newDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
            html.setAttribute('dir', newDir);
            dirBtn.innerText = newDir.toUpperCase();
        };
    </script>
</body>
</html>
