<!DOCTYPE html>
<html lang="en" dir="ltr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
    <!-- <link rel="icon" href="assets/game-center.png"> -->
    <title>Secure Your Seat | Dice & Beans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#f97316' } } }
        }
    </script>
    <style>
        /* Allows smooth scrolling on iOS */
        .custom-scroll { -webkit-overflow-scrolling: touch; }
        input:focus, select:focus { transform: translateY(-2px); }
        .form-card { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @media (min-width: 1024px) {
            .form-card:hover { transform: translateY(-5px); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-full flex flex-col custom-scroll">

    <nav class="p-4 md:p-6 flex justify-between items-center shrink-0 sticky top-0 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-md z-30">
        <a href="index.html" class="flex items-center gap-2 md:gap-3 group transition-all">
            <div class="bg-primary p-2 rounded-xl group-hover:rotate-12 transition-transform shadow-lg shadow-orange-500/20">
                <i data-lucide="dices" class="text-white w-5 h-5 md:w-6 h-6"></i>
            </div>
            <span class="text-lg md:text-2xl font-black uppercase tracking-tighter group-hover:text-primary transition-colors">Dice & Beans</span>
        </a>

        <div class="flex gap-2 md:gap-3">
            <button id="theme-toggle" class="p-2.5 md:p-3 rounded-2xl bg-white dark:bg-slate-800 shadow-xl border dark:border-slate-700 hover:ring-2 ring-primary transition-all">
                <i data-lucide="moon" id="theme-icon" class="w-4 h-4 md:w-5 h-5"></i>
            </button>
            <button id="dir-toggle" class="p-2.5 md:p-3 rounded-2xl bg-white dark:bg-slate-800 shadow-xl border dark:border-slate-700 font-bold text-[10px] md:text-xs hover:ring-2 ring-primary transition-all">
                LTR
            </button>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-8 md:py-12 relative overflow-x-hidden">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 md:w-96 md:h-96 bg-primary/10 rounded-full blur-[80px] md:blur-[100px] pointer-events-none"></div>

        <div class="w-full max-w-xl relative z-10">
            <div class="text-center mb-6 md:mb-8">
                <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tighter mb-2 leading-tight">Book Your <span class="text-primary italic">Adventure</span></h2>
                <p class="text-sm md:text-base text-slate-500 dark:text-slate-400 font-medium px-4">Your favorite board games are waiting.</p>
            </div>

            <div class="form-card bg-white dark:bg-slate-900 p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] shadow-xl dark:shadow-none border border-slate-100 dark:border-slate-800">
                <form class="space-y-5 md:space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] md:text-xs font-black uppercase tracking-widest text-primary ml-1">Select Date</label>
                            <div class="relative">
                                <i data-lucide="calendar" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                                <input type="date" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-12 pr-4 py-3.5 md:py-4 focus:ring-2 ring-primary/50 border-transparent outline-none transition-all dark:text-white text-sm">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] md:text-xs font-black uppercase tracking-widest text-primary ml-1">Arrival Time</label>
                            <div class="relative">
                                <i data-lucide="clock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                                <select class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-12 pr-4 py-3.5 md:py-4 focus:ring-2 ring-primary/50 border-transparent outline-none transition-all appearance-none cursor-pointer text-sm">
                                    <option>04:00 PM</option>
                                    <option>06:00 PM</option>
                                    <option>08:00 PM</option>
                                    <option>10:00 PM</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] md:text-xs font-black uppercase tracking-widest text-primary ml-1">No. of Players</label>
                            <div class="flex items-center bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-1">
                                <button type="button" onclick="stepDown()" class="p-3 text-primary hover:bg-white dark:hover:bg-slate-700 rounded-xl transition-all"><i data-lucide="minus" class="w-4 h-4"></i></button>
                                <input type="number" id="player-count" value="2" class="w-full bg-transparent text-center font-black text-lg outline-none" readonly>
                                <button type="button" onclick="stepUp()" class="p-3 text-primary hover:bg-white dark:hover:bg-slate-700 rounded-xl transition-all"><i data-lucide="plus" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] md:text-xs font-black uppercase tracking-widest text-primary ml-1">Interested In</label>
                            <div class="relative">
                                <i data-lucide="dices" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                                <input type="text" placeholder="e.g. Catan" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-12 pr-4 py-3.5 md:py-4 focus:ring-2 ring-primary/50 border-transparent outline-none transition-all text-sm">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] md:text-xs font-black uppercase tracking-widest text-primary ml-1">Lead Gamer Name</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input type="text" placeholder="John Doe" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-12 pr-4 py-3.5 md:py-4 focus:ring-2 ring-primary/50 border-transparent outline-none transition-all text-sm">
                        </div>
                    </div>

                    <button class="w-full bg-primary text-white py-4 md:py-5 rounded-[1.2rem] md:rounded-[1.5rem] font-black text-lg md:text-xl hover:bg-orange-600 hover:shadow-2xl hover:shadow-orange-500/30 transition-all active:scale-95 flex items-center justify-center gap-3 group">
                        <span>Confirm Table</span>
                        <i data-lucide="send" class="w-5 h-5 md:w-6 h-6 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="p-6 md:p-8 text-center shrink-0">
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-6 text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest">
            <span class="flex items-center gap-1.5"><i data-lucide="check" class="w-3.5 h-3.5 text-green-500"></i> Free To Cancel</span>
            <span class="flex items-center gap-1.5"><i data-lucide="check" class="w-3.5 h-3.5 text-green-500"></i> 15 Min Grace Period</span>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        const html = document.documentElement;

        // --- Stepper Logic ---
        const playerInput = document.getElementById('player-count');
        window.stepUp = () => playerInput.value = parseInt(playerInput.value) + 1;
        window.stepDown = () => { if(playerInput.value > 1) playerInput.value = parseInt(playerInput.value) - 1; };

        // --- Theme Persistence ---
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        const updateIcons = (isDark) => {
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        };

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            updateIcons(true);
        }

        themeBtn.onclick = () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateIcons(isDark);
        };

        // --- LTR/RTL Logic ---
        const dirBtn = document.getElementById('dir-toggle');
        dirBtn.onclick = () => {
            const currentDir = html.getAttribute('dir') || 'ltr';
            const newDir = currentDir === 'ltr' ? 'rtl' : 'ltr';
            html.setAttribute('dir', newDir);
            dirBtn.innerText = newDir.toUpperCase();
        };
    </script>
</body>
</html>
